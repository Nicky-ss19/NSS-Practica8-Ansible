# Mis 5 servidores Ubuntu (contenedores de Docker)
# Todos corren en esta misma máquina (127.0.0.1), pero cada uno tiene su propio puerto SSH

[servidores]
servidor1 ansible_host=127.0.0.1 ansible_port=2201
servidor2 ansible_host=127.0.0.1 ansible_port=2202
servidor3 ansible_host=127.0.0.1 ansible_port=2203
servidor4 ansible_host=127.0.0.1 ansible_port=2204
servidor5 ansible_host=127.0.0.1 ansible_port=2205

# Los datos para entrar, que son iguales para los 5 servidores
[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_python_interpreter=/usr/bin/python3